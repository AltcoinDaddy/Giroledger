# GiroLedger, all three processes.
#
#   docker compose up --build
#
# Reads .env from this directory. That file is gitignored and never copied into
# an image: secrets arrive at run time, and the VITE_* values are passed to the
# web build as arguments because Vite inlines them at build time.
#
# Both services must run. The operator turns a payment into a rule; without it
# the payment sits at the Core Vault and nothing happens. The keeper then
# executes due rules.

services:
  operator:
    build:
      context: .
      target: operator
    env_file: [.env]
    environment:
      # Inside the compose network the container binds all interfaces; the
      # published port is what the browser and the pay script talk to.
      OPERATOR_HTTP_PORT: 8080
      STATE_DIR: /app/apps/operator/data
    ports: ["8080:8080"]
    volumes:
      # Named volume, not a bind mount: the store must survive `docker compose
      # down` or a restart forgets every in-flight payment.
      - operator-data:/app/apps/operator/data
    restart: unless-stopped

  keeper:
    build:
      context: .
      target: keeper
    env_file: [.env]
    environment:
      HEALTH_PORT: 8081
      STATE_DIR: /app/apps/keeper/data
    ports: ["8081:8081"]
    volumes:
      - keeper-data:/app/apps/keeper/data
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
      args:
        # Baked into the bundle. Changing any of these needs a rebuild, not a
        # restart, which is why they are args rather than environment.
        VITE_RULE_REGISTRY_ADDRESS: ${VITE_RULE_REGISTRY_ADDRESS}
        VITE_RULE_EXECUTOR_ADDRESS: ${VITE_RULE_EXECUTOR_ADDRESS}
        VITE_VAULT_ADDRESS: ${VITE_VAULT_ADDRESS}
        # The browser reaches the operator from the host, so localhost is
        # correct here even though compose has its own network. Set this to the
        # public URL when deploying somewhere real.
        VITE_OPERATOR_URL: ${VITE_OPERATOR_URL:-http://localhost:8080}
        VITE_SITE_URL: ${VITE_SITE_URL:-http://localhost:3000}
    ports: ["3000:3000"]
    depends_on: [operator]
    restart: unless-stopped

volumes:
  operator-data:
  keeper-data:
