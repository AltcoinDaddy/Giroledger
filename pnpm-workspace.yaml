packages:
  - "apps/*"
  - "packages/*"
  - "contracts"

# Native postinstall builds must be opted into explicitly in pnpm 10+.
allowBuilds:
  esbuild: true
  lightningcss: true
  unrs-resolver: true

catalog:
  # Single source of truth for versions shared across workspaces.
  # Bump here, not in individual package.json files.
  typescript: ^6.0.2
  "@types/node": ^22.10.2
  viem: ^2.21.0
  xrpl: ^4.1.0
  tsx: ^4.19.2
  pino: ^9.5.0
  pino-pretty: ^13.0.0
  zod: ^3.24.1

minimumReleaseAgeExclude:
  - framer-motion@12.43.0
  - motion-dom@12.43.0
  - motion@12.43.0
